<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClarkVerse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .pirate {
      font-size: 72px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
    }

    .subtitle {
      color: #aeb7cc;
      margin: 10px 0 30px;
      font-size: 16px;
    }

    .card {
      background: #151c31;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      background: #252e48;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #5865f2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #message {
      margin-top: 15px;
      color: #aeb7cc;
      min-height: 20px;
    }

    .tagline {
      margin-top: 25px;
      color: #7f8aa3;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="pirate">🏴‍☠️</div>

    <h1>ClarkVerse</h1>

    <p class="subtitle">
      Your world. Your people. Your conversations.
    </p>

    <div class="card">

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button onclick="login()">
        Board the ship? 🏴‍☠️
      </button>

      <div id="message"></div>

    </div>

    <div class="tagline">
      ⚓ Welcome aboard, matey.
    </div>

  </div>

  <script>
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Enter your email and password.";
        return;
      }

      message.textContent = "Welcome aboard, matey! 🏴‍☠️";
    }
  </script>

</body>
</html>
