<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClarkVerse</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.app {
  width: 92%;
  max-width: 430px;
  text-align: center;
  position: relative;
  z-index: 2;
}

.logo {
  font-size: 70px;
}

h1 {
  font-size: 42px;
  margin: 5px 0;
}

.subtitle {
  color: #9ba8bd;
  margin-bottom: 28px;
}

.card {
  background: #141d31;
  padding: 24px;
  border-radius: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,.4);
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  margin: 7px 0;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .15s ease;
}

button:active {
  transform: scale(.94);
}

.email,
.board {
  background: #5865f2;
  color: white;
}

.back {
  background: transparent;
  color: #9ba8bd;
  font-weight: normal;
}

input {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  border: 0;
  outline: 0;
  border-radius: 12px;
  background: #263149;
  color: white;
  font-size: 16px;
}

input::placeholder {
  color: #8996ac;
}

.message {
  color: #b7c2d6;
  font-size: 14px;
  line-height: 1.5;
  margin-top: 12px;
}

.hidden {
  display: none;
}

.small {
  color: #718097;
  font-size: 13px;
  margin-top: 22px;
}


/* =========================
   OCEAN ANIMATION
   ========================= */

#ocean {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  overflow: hidden;
  pointer-events: none;
}

#ocean.active {
  display: block;
}

.water {
  position: absolute;
  left: -5%;
  bottom: -120vh;
  width: 110%;
  height: 230vh;

  background: linear-gradient(
    #2bd0ed,
    #079ac5 35%,
    #05658e 70%,
    #034766
  );

  animation: waterRise 1.25s ease-out forwards;
}

.wave {
  position: absolute;
  left: -15%;
  width: 130%;
  height: 190px;
  border-radius: 50%;
  transform: translateY(100vh);
}

.wave1 {
  top: -45px;
  background: #48dcf5;
  animation: waveRise 1.1s ease-out forwards;
}

.wave2 {
  top: 15px;
  background: #18b5da;
  animation: waveRise 1.2s .08s ease-out forwards;
}

.wave3 {
  top: 70px;
  background: #078eb8;
  animation: waveRise 1.3s .16s ease-out forwards;
}

.ship {
  position: absolute;
  z-index: 10;
  top: 43%;
  left: -240px;
  font-size: 110px;
  white-space: nowrap;

  animation:
    shipSail 2.7s .3s
    cubic-bezier(.2,.7,.3,1)
    forwards;
}

.wake {
  position: absolute;
  z-index: 8;
  top: calc(43% + 85px);
  left: -260px;
  width: 200px;
  height: 35px;
  border-radius: 50%;
  background: rgba(255,255,255,.4);
  filter: blur(4px);

  animation:
    wakeSail 2.7s .3s ease forwards;
}

.bubble {
  position: absolute;
  bottom: -20px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255,255,255,.45);

  animation: bubbles 2s linear infinite;
}

.b1 { left: 15%; }
.b2 {
  left: 40%;
  width: 8px;
  height: 8px;
  animation-delay: .7s;
}
.b3 {
  left: 70%;
  width: 15px;
  height: 15px;
  animation-delay: .4s;
}
.b4 {
  left: 85%;
  width: 7px;
  height: 7px;
  animation-delay: 1s;
}

.clear {
  animation: clearOcean .55s ease forwards;
}


/* =========================
   ANIMATIONS
   ========================= */

@keyframes waterRise {
  from { bottom: -120vh; }
  to { bottom: -20vh; }
}

@keyframes waveRise {
  from { transform: translateY(100vh); }
  to { transform: translateY(0); }
}

@keyframes shipSail {
  0% {
    left: -240px;
    transform: rotate(-3deg);
  }

  25% {
    transform: rotate(3deg);
  }

  50% {
    transform: rotate(-2deg);
  }

  75% {
    transform: rotate(2deg);
  }

  100% {
    left: calc(100vw + 240px);
    transform: rotate(-2deg);
  }
}

@keyframes wakeSail {
  from { left: -260px; }
  to { left: calc(100vw + 260px); }
}

@keyframes bubbles {
  0% {
    bottom: -20px;
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  100% {
    bottom: 110vh;
    opacity: 0;
  }
}

@keyframes clearOcean {
  from { opacity: 1; }
  to { opacity: 0; }
}
</style>
</head>

<body>


<!-- =========================
     PIRATE OCEAN
     ========================= -->

<div id="ocean">

  <div class="water"></div>

  <div class="wave wave1"></div>
  <div class="wave wave2"></div>
  <div class="wave wave3"></div>

  <div class="ship">
    🏴‍☠️🚢
  </div>

  <div class="wake"></div>

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>

</div>


<!-- =========================
     APP
     ========================= -->

<div class="app">

  <div class="logo">
    🏴‍☠️
  </div>

  <h1>
    ClarkVerse
  </h1>

  <div class="subtitle">
    Your world. Your people. Your conversations.
  </div>


  <!-- WELCOME -->

  <div id="welcomeScreen" class="card">

    <button
      class="email"
      onclick="openEmail()">

      ✉️ &nbsp; Sign up with Email

    </button>

  </div>


  <!-- EMAIL -->

  <div id="emailScreen" class="card hidden">

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Email">

    <input
      id="password"
      type="password"
      autocomplete="new-password"
      placeholder="Password">


    <button
      id="signupButton"
      class="board"
      onclick="signupEmail()">

      Board the ship? 🏴‍☠️

    </button>


    <button
      class="back"
      onclick="goBack()">

      ← Back

    </button>


    <div
      id="message"
      class="message">
    </div>

  </div>


  <div class="small">
    ⚓ Welcome aboard, matey.
  </div>

</div>


<!-- =========================
     SUPABASE
     ========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/*
========================================
SUPABASE SETTINGS
========================================

Put your values INSIDE the quotation marks.

Use:
1. Your Supabase Project URL
2. Your Supabase Publishable key

DO NOT use your service_role/secret key.
========================================
*/

const SUPABASE_URL =
"https://berkdlglcktrpsrmcfxk.supabase.co" ;

const SUPABASE_KEY =
"sb_publishable_VcCBURG2CreUEmvkxDa3RQ_EkK1WZlq";


/* Create Supabase client */

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   OPEN EMAIL SCREEN
   ========================= */

function openEmail() {

  const ocean =
    document.getElementById("ocean");

  ocean.classList.remove("clear");
  ocean.classList.add("active");


  setTimeout(function() {

    document
      .getElementById("welcomeScreen")
      .classList.add("hidden");

    document
      .getElementById("emailScreen")
      .classList.remove("hidden");

  }, 1500);


  setTimeout(function() {

    ocean.classList.add("clear");

  }, 2450);


  setTimeout(function() {

    ocean.classList.remove("active");
    ocean.classList.remove("clear");

  }, 3050);

}


/* =========================
   BACK BUTTON
   ========================= */

function goBack() {

  document
    .getElementById("emailScreen")
    .classList.add("hidden");

  document
    .getElementById("welcomeScreen")
    .classList.remove("hidden");

}


/* =========================
   EMAIL SIGNUP
   ========================= */

async function signupEmail() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("signupButton");


  if (!email || !password) {

    message.textContent =
      "Enter your email and password.";

    return;
  }


  if (password.length < 6) {

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "Sailing... 🚢";

  message.textContent =
    "Creating your account...";


  try {

    const { data, error } =
      await sb.auth.signUp({

        email: email,

        password: password,

        options: {

          /*
          AFTER EMAIL VERIFICATION,
          SEND USER TO feed.html
          */

          emailRedirectTo:
            window.location.origin +
            "/feed.html"

        }

      });


    if (error) {

      button.disabled = false;

      button.textContent =
        "Board the ship? 🏴‍☠️";

      message.textContent =
        error.message;

      return;
    }


    button.textContent =
      "You're aboard! 🏴‍☠️";

    message.textContent =
      "📧 Check your email and verify your account. After verification, you'll be sent to the ClarkVerse video feed!";


  } catch (error) {

    button.disabled = false;

    button.textContent =
      "Board the ship? 🏴‍☠️";

    message.textContent =
      "Something went wrong. Please try again.";

    console.error(error);

  }

}

</script>

</body>
</html>
