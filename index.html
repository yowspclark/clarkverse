<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClarkVerse</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .app {
      width: 92%;
      max-width: 430px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    /* ================================
       FEED FLAG
       ================================ */
    .feed-flag {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      width: auto;
      min-width: 54px;
      padding: 10px 13px;
      margin: 0;
      border-radius: 15px;
      background: #141d31;
      border: 1px solid #33405b;
      box-shadow: 0 8px 25px rgba(0,0,0,.35);
      font-size: 25px;
      line-height: 1;
    }
    .feed-flag:active {
      transform: scale(.92);
    }
    /* ================================
       MAIN SCREEN
       ================================ */
    .logo {
      font-size: 70px;
    }
    h1 {
      font-size: 42px;
      margin: 5px 0;
    }
    .subtitle {
      color: #9ba8bd;
      margin-bottom: 28px;
      line-height: 1.4;
    }
    .card {
      background: #141d31;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin: 7px 0;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      transform: scale(.97);
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .primary {
      background: #5865f2;
      color: white;
    }
    .secondary {
      background: #263149;
      color: white;
    }
    .back {
      background: transparent;
      color: #9ba8bd;
      font-weight: normal;
    }
    .forgot {
      background: transparent;
      color: #8ea0ff;
      font-size: 14px;
      padding: 8px;
    }
    input {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 0;
      outline: 0;
      border-radius: 12px;
      background: #263149;
      color: white;
      font-size: 16px;
    }
    input::placeholder {
      color: #8996ac;
    }
    .message {
      color: #b7c2d6;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 12px;
    }
    .hidden {
      display: none !important;
    }
    .small {
      color: #718097;
      font-size: 13px;
      margin-top: 22px;
    }
    .screen-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 5px;
    }
    .screen-subtitle {
      color: #9ba8bd;
      font-size: 14px;
      margin-bottom: 15px;
    }
    /* ================================
       OCEAN
       ================================ */
    #ocean {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      overflow: hidden;
      pointer-events: none;
    }
    #ocean.active {
      display: block;
    }
    .water {
      position: absolute;
      left: -5%;
      bottom: -120vh;
      width: 110%;
      height: 230vh;
      background: linear-gradient(
        #2bd0ed,
        #079ac5 35%,
        #05658e 70%,
        #034766
      );
      animation: waterRise 1.25s ease-out forwards;
    }
    .wave {
      position: absolute;
      left: -15%;
      width: 130%;
      height: 190px;
      border-radius: 50%;
      transform: translateY(100vh);
    }
    .wave1 {
      top: -45px;
      background: #48dcf5;
      animation: waveRise 1.1s ease-out forwards;
    }
    .wave2 {
      top: 15px;
      background: #18b5da;
      animation: waveRise 1.2s .08s ease-out forwards;
    }
    .wave3 {
      top: 70px;
      background: #078eb8;
      animation: waveRise 1.3s .16s ease-out forwards;
    }
    .ship {
      position: absolute;
      z-index: 10;
      top: 43%;
      left: -240px;
      font-size: 110px;
      white-space: nowrap;
      animation:
        shipSail 2.7s .3s
        cubic-bezier(.2,.7,.3,1)
        forwards;
    }
    .wake {
      position: absolute;
      z-index: 8;
      top: calc(43% + 85px);
      left: -260px;
      width: 200px;
      height: 35px;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      filter: blur(4px);
      animation:
        wakeSail 2.7s .3s ease forwards;
    }
    .bubble {
      position: absolute;
      bottom: -20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,.45);
      animation:
        bubbles 2s linear infinite;
    }
    .b1 {
      left: 15%;
    }
    .b2 {
      left: 40%;
      width: 8px;
      height: 8px;
      animation-delay: .7s;
    }
    .b3 {
      left: 70%;
      width: 15px;
      height: 15px;
      animation-delay: .4s;
    }
    .b4 {
      left: 85%;
      width: 7px;
      height: 7px;
      animation-delay: 1s;
    }
    .clear {
      animation: clearOcean .55s ease forwards;
    }
    @keyframes waterRise {
      from {
        bottom: -120vh;
      }
      to {
        bottom: -20vh;
      }
    }
    @keyframes waveRise {
      from {
        transform: translateY(100vh);
      }
      to {
        transform: translateY(0);
      }
    }
    @keyframes shipSail {
      0% {
        left: -240px;
        transform: rotate(-3deg);
      }
      25% {
        transform: rotate(3deg);
      }
      50% {
        transform: rotate(-2deg);
      }
      75% {
        transform: rotate(2deg);
      }
      100% {
        left: calc(100vw + 240px);
        transform: rotate(-2deg);
      }
    }
    @keyframes wakeSail {
      from {
        left: -260px;
      }
      to {
        left: calc(100vw + 260px);
      }
    }
    @keyframes bubbles {
      0% {
        bottom: -20px;
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        bottom: 110vh;
        opacity: 0;
      }
    }
    @keyframes clearOcean {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- ================================
       FLAG
       ================================ -->
  <button
    class="feed-flag"
    onclick="goToFeed()"
    aria-label="Go to ClarkVerse feed">
    🏴
  </button>
  <!-- ================================
       PIRATE/OCEAN ANIMATION
       ================================ -->
  <div id="ocean">
    <div class="water"></div>
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
    <div class="ship">
      🏴‍☠️🚢
    </div>
    <div class="wake"></div>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
  </div>
  <!-- ================================
       MAIN APP
       ================================ -->
  <div class="app">
    <div class="logo">
      🏴‍☠️
    </div>
    <h1>
      ClarkVerse
    </h1>
    <div class="subtitle">
      Your world. Your people. Your conversations.
    </div>
    <!-- WELCOME -->
    <div
      id="welcomeScreen"
      class="card">
      <button
        class="primary"
        onclick="openSignup()">
        🏴‍☠️ Board the ship
      </button>
      <button
        class="secondary"
        onclick="openLogin()">
        ⚓ If you're already on the ship
      </button>
    </div>
    <!-- SIGN UP -->
    <div
      id="signupScreen"
      class="card hidden">
      <div class="screen-title">
        Board the ship 🏴‍☠️
      </div>
      <div class="screen-subtitle">
        Create your ClarkVerse account
      </div>
      <input
        id="signupEmail"
        type="email"
        autocomplete="email"
        placeholder="Email">
      <input
        id="signupPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Password">
      <button
        id="signupButton"
        class="primary"
        onclick="signup()">
        Create account
      </button>
      <button
        class="back"
        onclick="showWelcome()">
        ← Back
      </button>
      <div
        id="signupMessage"
        class="message">
      </div>
    </div>
    <!-- LOGIN -->
    <div
      id="loginScreen"
      class="card hidden">
      <div class="screen-title">
        Welcome back ⚓
      </div>
      <div class="screen-subtitle">
        Sign in to your ClarkVerse account
      </div>
      <input
        id="loginEmail"
        type="email"
        autocomplete="email"
        placeholder="Email">
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Password">
      <button
        id="loginButton"
        class="primary"
        onclick="login()">
        Sign in
      </button>
      <button
        class="forgot"
        onclick="forgotPassword()">
        Forgot password?
      </button>
      <button
        class="back"
        onclick="showWelcome()">
        ← Back
      </button>
      <div
        id="loginMessage"
        class="message">
      </div>
    </div>
    <!-- RESET -->
    <div
      id="resetScreen"
      class="card hidden">
      <div class="screen-title">
        Reset password 🔑
      </div>
      <div class="screen-subtitle">
        Enter your email and we'll send you a reset link.
      </div>
      <input
        id="resetEmail"
        type="email"
        autocomplete="email"
        placeholder="Email">
      <button
        id="resetButton"
        class="primary"
        onclick="sendReset()">
        Send reset email
      </button>
      <button
        class="back"
        onclick="openLogin()">
        ← Back to sign in
      </button>
      <div
        id="resetMessage"
        class="message">
      </div>
    </div>
    <div class="small">
      ⚓ Welcome aboard, matey.
    </div>
  </div>
  <!-- ================================
       SUPABASE
       ================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /*
    ========================================
    SUPABASE SETTINGS
    ========================================
    */
    const SUPABASE_URL =
      "https://berkdlglcktrpsrmcfxk.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_VcCBURG2CreUEmvkxDa3RQ_EkK1WZlq";
    /*
    ========================================
    CLARKVERSE URLS
    ========================================
    */
    const SITE_URL =
      "https://yowspclark.github.io/ClarkVerse/";
    const FEED_URL =
      "https://yowspclark.github.io/ClarkVerse/feed.html";
    /*
    ========================================
    SUPABASE CLIENT
    ========================================
    */
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    /*
    ========================================
    GO TO FEED
    ========================================
    */
    function goToFeed() {
      window.location.href =
        FEED_URL;
    }
    /*
    ========================================
    SCREEN HELPERS
    ========================================
    */
    function hideAllScreens() {
      document
        .getElementById("welcomeScreen")
        .classList.add("hidden");
      document
        .getElementById("signupScreen")
        .classList.add("hidden");
      document
        .getElementById("loginScreen")
        .classList.add("hidden");
      document
        .getElementById("resetScreen")
        .classList.add("hidden");
    }
    function showWelcome() {
      hideAllScreens();
      document
        .getElementById("welcomeScreen")
        .classList.remove("hidden");
    }
    function openSignup() {
      hideAllScreens();
      document
        .getElementById("signupScreen")
        .classList.remove("hidden");
      document
        .getElementById("signupMessage")
        .textContent = "";
    }
    function openLogin() {
      hideAllScreens();
      document
        .getElementById("loginScreen")
        .classList.remove("hidden");
      document
        .getElementById("loginMessage")
        .textContent = "";
    }
    function openReset() {
      hideAllScreens();
      document
        .getElementById("resetScreen")
        .classList.remove("hidden");
      document
        .getElementById("resetMessage")
        .textContent = "";
    }
    /*
    ========================================
    PIRATE ANIMATION
    ========================================
    */
    function pirateAnimation(callback) {
      const ocean =
        document.getElementById("ocean");
      ocean.classList.remove("clear");
      ocean.classList.add("active");
      /*
      Let the ocean and ship play
      before redirecting.
      */
      setTimeout(function() {
        if (callback) {
          callback();
        }
      }, 3000);
      setTimeout(function() {
        ocean.classList.add("clear");
      }, 2450);
      setTimeout(function() {
        ocean.classList.remove("active");
        ocean.classList.remove("clear");
      }, 3600);
    }
    /*
    ========================================
    SIGN UP
    ========================================
    */
    async function signup() {
      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();
      const password =
        document
          .getElementById("signupPassword")
          .value;
      const message =
        document.getElementById(
          "signupMessage"
        );
      const button =
        document.getElementById(
          "signupButton"
        );
      if (!email || !password) {
        message.textContent =
          "Enter your email and password.";
        return;
      }
      if (password.length < 6) {
        message.textContent =
          "Password must be at least 6 characters.";
        return;
      }
      button.disabled = true;
      button.textContent =
        "Sailing... 🚢";
      message.textContent =
        "Creating your account...";
      try {
        const {
          error
        } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              emailRedirectTo:
                FEED_URL
            }
          });
        if (error) {
          button.disabled = false;
          button.textContent =
            "Create account";
          message.textContent =
            error.message;
          return;
        }
        button.disabled = false;
        button.textContent =
          "Account created! 🏴‍☠️";
        message.textContent =
          "📧 Check your email to verify your account. After verification, you'll be sent to ClarkVerse.";
      }
      catch (error) {
        console.error(error);
        button.disabled = false;
        button.textContent =
          "Create account";
        message.textContent =
          "Something went wrong. Please try again.";
      }
    }
    /*
    ========================================
    LOGIN
    ========================================
    */
    async function login() {
      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();
      const password =
        document
          .getElementById("loginPassword")
          .value;
      const message =
        document.getElementById(
          "loginMessage"
        );
      const button =
        document.getElementById(
          "loginButton"
        );
      if (!email || !password) {
        message.textContent =
          "Enter your email and password.";
        return;
      }
      button.disabled = true;
      button.textContent =
        "Signing in... ⚓";
      message.textContent = "";
      try {
        const {
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });
        if (error) {
          button.disabled = false;
          button.textContent =
            "Sign in";
          message.textContent =
            error.message;
          return;
        }
        /*
        ====================================
        IMPORTANT:
        Do NOT redirect immediately.
        Play the pirate animation first.
        ====================================
        */
        message.textContent =
          "Welcome aboard! 🚢";
        pirateAnimation(function() {
          window.location.href =
            FEED_URL;
        });
      }
      catch (error) {
        console.error(error);
        button.disabled = false;
        button.textContent =
          "Sign in";
        message.textContent =
          "Something went wrong. Please try again.";
      }
    }
    /*
    ========================================
    FORGOT PASSWORD
    ========================================
    */
    function forgotPassword() {
      openReset();
      const loginEmail =
        document
          .getElementById("loginEmail")
          .value
          .trim();
      if (loginEmail) {
        document
          .getElementById("resetEmail")
          .value =
          loginEmail;
      }
    }
    /*
    ========================================
    PASSWORD RESET
    ========================================
    */
    async function sendReset() {
      const email =
        document
          .getElementById("resetEmail")
          .value
          .trim();
      const message =
        document.getElementById(
          "resetMessage"
        );
      const button =
        document.getElementById(
          "resetButton"
        );
      if (!email) {
        message.textContent =
          "Enter your email.";
        return;
      }
      button.disabled = true;
      button.textContent =
        "Sending...";
      try {
        const {
          error
        } =
          await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                SITE_URL
            }
          );
        if (error) {
          button.disabled = false;
          button.textContent =
            "Send reset email";
          message.textContent =
            error.message;
          return;
        }
        button.disabled = false;
        button.textContent =
          "Email sent! 📧";
        message.textContent =
          "Check your email for the password reset link.";
      }
      catch (error) {
        console.error(error);
        button.disabled = false;
        button.textContent =
          "Send reset email";
        message.textContent =
          "Something went wrong. Please try again.";
      }
    }
    /*
    ========================================
    AUTH STATE
    ========================================
    IMPORTANT:
    We intentionally do NOT automatically
    redirect SIGNED_IN here.
    login() controls the pirate animation
    and redirects afterward.
    ========================================
    */
    supabaseClient.auth.onAuthStateChange(
      function(event, session) {
        console.log(
          "ClarkVerse auth event:",
          event
        );
      }
    );
  </script>
</body>
</html>
