<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClarkVerse</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:#07111f;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.app{
width:92%;
max-width:430px;
text-align:center;
}

.logo{
font-size:70px;
}

h1{
font-size:42px;
margin:5px 0;
}

.subtitle{
color:#9ba8bd;
margin-bottom:28px;
}

.card{
background:#141d31;
padding:24px;
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

button{
width:100%;
border:0;
border-radius:14px;
padding:16px;
margin:7px 0;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:transform .15s ease;
}

button:active{
transform:scale(.94);
}

.google{
background:#fff;
color:#222;
}

.email,
.board{
background:#5865f2;
color:#fff;
}

input{
width:100%;
padding:15px;
margin:7px 0;
border:0;
outline:0;
border-radius:12px;
background:#263149;
color:#fff;
font-size:16px;
}

input::placeholder{
color:#8996ac;
}

.back{
background:transparent;
color:#9ba8bd;
font-weight:normal;
}

.message{
color:#b7c2d6;
font-size:14px;
line-height:1.5;
margin-top:12px;
}

.hidden{
display:none;
}

.small{
color:#718097;
font-size:13px;
margin-top:22px;
}


/* ==============================
   OCEAN
   ============================== */

#ocean{
position:fixed;
inset:0;
z-index:9999;
display:none;
overflow:hidden;
pointer-events:none;
}

#ocean.active{
display:block;
}

.water{
position:absolute;
left:-5%;
bottom:-120vh;
width:110%;
height:230vh;

background:linear-gradient(
#2bd0ed,
#079ac5 35%,
#05658e 70%,
#034766
);

animation:waterRise 1.25s ease-out forwards;
}

.wave{
position:absolute;
left:-15%;
width:130%;
height:190px;
border-radius:50%;
transform:translateY(100vh);
}

.wave1{
top:-45px;
background:#48dcf5;
animation:waveRise 1.1s ease-out forwards;
}

.wave2{
top:15px;
background:#18b5da;
animation:waveRise 1.2s .08s ease-out forwards;
}

.wave3{
top:70px;
background:#078eb8;
animation:waveRise 1.3s .16s ease-out forwards;
}

.ship{
position:absolute;
z-index:10;
top:43%;
left:-240px;
font-size:110px;
white-space:nowrap;

animation:
shipSail 2.7s .3s cubic-bezier(.2,.7,.3,1) forwards;
}

.wake{
position:absolute;
z-index:8;
top:calc(43% + 85px);
left:-260px;
width:200px;
height:35px;
border-radius:50%;
background:rgba(255,255,255,.4);
filter:blur(4px);

animation:
wakeSail 2.7s .3s ease forwards;
}

.bubble{
position:absolute;
bottom:-20px;
width:12px;
height:12px;
border-radius:50%;
background:rgba(255,255,255,.45);

animation:bubbles 2s linear infinite;
}

.b1{
left:15%;
}

.b2{
left:40%;
width:8px;
height:8px;
animation-delay:.7s;
}

.b3{
left:70%;
width:15px;
height:15px;
animation-delay:.4s;
}

.b4{
left:85%;
width:7px;
height:7px;
animation-delay:1s;
}

.splash{
position:absolute;
z-index:9;
left:50%;
top:50%;
width:300px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,.3);

transform:
translate(-50%,-50%)
scale(.2);

opacity:0;

animation:
splash .9s 1.3s ease-out forwards;
}

.clear{
animation:clearOcean .55s ease forwards;
}


/* ==============================
   ANIMATIONS
   ============================== */

@keyframes waterRise{

from{
bottom:-120vh;
}

to{
bottom:-20vh;
}

}

@keyframes waveRise{

from{
transform:translateY(100vh);
}

to{
transform:translateY(0);
}

}

@keyframes shipSail{

0%{
left:-240px;
transform:rotate(-3deg);
}

25%{
transform:rotate(3deg);
}

50%{
transform:rotate(-2deg);
}

75%{
transform:rotate(2deg);
}

100%{
left:calc(100vw + 240px);
transform:rotate(-2deg);
}

}

@keyframes wakeSail{

0%{
left:-260px;
}

100%{
left:calc(100vw + 260px);
}

}

@keyframes bubbles{

0%{
bottom:-20px;
opacity:0;
}

20%{
opacity:1;
}

100%{
bottom:110vh;
opacity:0;
}

}

@keyframes splash{

0%{
transform:translate(-50%,-50%) scale(.2);
opacity:0;
}

45%{
transform:translate(-50%,-50%) scale(1.5);
opacity:1;
}

100%{
transform:translate(-50%,-50%) scale(2.5);
opacity:0;
}

}

@keyframes clearOcean{

from{
opacity:1;
}

to{
opacity:0;
}

}
</style>
</head>


<body>


<!-- ==================================
     PIRATE ADVENTURE MUSIC
     ================================== -->

<audio
id="pirateMusic"
src="pirate-music.mp3"
preload="auto">
</audio>


<!-- ==================================
     OCEAN ANIMATION
     ================================== -->

<div id="ocean">

<div class="water"></div>

<div class="wave wave1"></div>
<div class="wave wave2"></div>
<div class="wave wave3"></div>

<div class="ship">
🏴‍☠️🚢
</div>

<div class="wake"></div>

<div class="splash"></div>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>

</div>


<!-- ==================================
     CLARKVERSE
     ================================== -->

<div class="app">

<div class="logo">
🏴‍☠️
</div>

<h1>
ClarkVerse
</h1>

<div class="subtitle">
Your world. Your people. Your conversations.
</div>


<!-- MAIN SCREEN -->

<div
id="mainScreen"
class="card">

<button
class="google"
onclick="transitionTo('google')">

G &nbsp;
Sign up with Google

</button>


<button
class="email"
onclick="transitionTo('email')">

✉️ &nbsp;
Sign up with Email

</button>

</div>


<!-- EMAIL SCREEN -->

<div
id="emailScreen"
class="card hidden">

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">


<button
id="boardButton"
class="board"
onclick="signupEmail()">

Board the ship? 🏴‍☠️

</button>


<button
class="back"
onclick="goBack()">

← Back

</button>


<div
id="message"
class="message">
</div>

</div>


<!-- GOOGLE SCREEN -->

<div
id="googleScreen"
class="card hidden">

<div
style="font-size:50px;font-weight:bold;">

G

</div>

<h2>
Sign up with Google
</h2>

<div class="subtitle">
Continue with Google to join ClarkVerse.
</div>


<button
class="google"
onclick="signupGoogle()">

G &nbsp;
Continue with Google

</button>


<button
class="back"
onclick="goBack()">

← Back

</button>

</div>


<div class="small">
⚓ Welcome aboard, matey.
</div>

</div>


<script>


/* ==================================
   SUPABASE
   ==================================

   ONLY CHANGE THE TEXT INSIDE
   THE QUOTATION MARKS BELOW.
   ================================== */


const SUPABASE_URL =
"https://berkdlglcktrpsrmcfxk.supabase.co";


const SUPABASE_KEY =
"sb_publishable_VcCBURG2CreUEmvkxDa3RQ_EkK1WZlq";


/* Load Supabase */

const script =
document.createElement("script");


script.src =
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


script.onload =
function(){

window.sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

};


document.head.appendChild(script);


/* ==================================
   MUSIC FADE IN
   ================================== */

function fadeMusicIn(){

const music =
document.getElementById("pirateMusic");


music.currentTime=0;
music.volume=0;


music.play().catch(
function(){
console.log(
"Music playback was blocked."
);
}
);


let volume=0;


const fade=setInterval(
function(){

volume+=0.04;


if(volume>=0.65){

volume=0.65;

clearInterval(fade);

}


music.volume=volume;

},
100
);

}


/* ==================================
   MUSIC FADE OUT
   ================================== */

function fadeMusicOut(){

const music =
document.getElementById("pirateMusic");


let volume=
music.volume;


const fade=setInterval(
function(){

volume-=0.05;


if(volume<=0){

volume=0;

clearInterval(fade);

music.pause();

music.currentTime=0;

}


music.volume=volume;

},
80
);

}


/* ==================================
   OCEAN TRANSITION
   ================================== */

function transitionTo(screen){

const ocean=
document.getElementById("ocean");


ocean.classList.remove("clear");

ocean.classList.add("active");


/* START PIRATE ADVENTURE */

fadeMusicIn();


/* CHANGE SCREEN */

setTimeout(
function(){

document
.getElementById("mainScreen")
.classList.add("hidden");


document
.getElementById("emailScreen")
.classList.add("hidden");


document
.getElementById("googleScreen")
.classList.add("hidden");


if(screen==="email"){

document
.getElementById("emailScreen")
.classList.remove("hidden");

}


if(screen==="google"){

document
.getElementById("googleScreen")
.classList.remove("hidden");

}

},
1500
);


/* FADE OCEAN */

setTimeout(
function(){

ocean.classList.add("clear");

},
2450
);


/* FADE MUSIC */

setTimeout(
function(){

fadeMusicOut();

},
2450
);


/* CLEAN UP */

setTimeout(
function(){

ocean.classList.remove("active");

ocean.classList.remove("clear");

},
3050
);

}


/* ==================================
   BACK
   ================================== */

function goBack(){

document
.getElementById("emailScreen")
.classList.add("hidden");


document
.getElementById("googleScreen")
.classList.add("hidden");


document
.getElementById("mainScreen")
.classList.remove("hidden");

}


/* ==================================
   EMAIL SIGNUP
   ================================== */

async function signupEmail(){

const email=
document
.getElementById("email")
.value
.trim();


const password=
document
.getElementById("password")
.value;


const message=
document.getElementById("message");


const button=
document.getElementById("boardButton");


if(!email||!password){

message.textContent=
"Enter your email and password.";

return;

}


if(password.length<6){

message.textContent=
"Password must be at least 6 characters.";

return;

}


if(!window.sb){

message.textContent=
"ClarkVerse is connecting. Try again.";

return;

}


button.textContent=
"Sailing... 🚢";


message.textContent=
"Boarding the ship... 🏴‍☠️";


const result=
await window.sb.auth.signUp({

email:email,

password:password,

options:{
emailRedirectTo:
window.location.href
}

});


if(result.error){

button.textContent=
"Board the ship? 🏴‍☠️";

message.textContent=
result.error.message;

return;

}


button.textContent=
"You're aboard! 🏴‍☠️";


message.textContent=
"📧 Check your email to verify your ClarkVerse account!";

}


/* ==================================
   GOOGLE SIGNUP
   ================================== */

async function signupGoogle(){

if(!window.sb){

alert(
"ClarkVerse is still connecting. Try again."
);

return;

}


const result=
await window.sb.auth.signInWithOAuth({

provider:"google",

options:{
redirectTo:
window.location.href
}

});


if(result.error){

alert(
result.error.message
);

}

}

</script>

</body>
</html>
